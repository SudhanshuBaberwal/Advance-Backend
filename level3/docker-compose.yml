services:
  nginx:
    image: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  server1:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_NAME=First SERVER
    ports:
      - "5001:7000"
    depends_on:
      - redis

  server2:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_NAME=Second SERVER
    ports:
      - "5002:7000"
    depends_on:
      - redis

  server3:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_NAME=Third SERVER
    ports:
      - "5003:7000"
    depends_on:
      - redis